<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      type="text/javascript"
      src="https://alcdn.msauth.net/browser/2.27.0/js/msal-browser.min.js"
      integrity="sha384-IlUQkOwOI6mWk8GNIWu8hpPE1sasxSg3gGjZo0dncq6IhHsTlH51mp5mhFYS5po1"
      crossorigin="anonymous"
    ></script>
    <script src="//cdn.jsdelivr.net/npm/eruda"></script>
    <script>
      eruda.init();
    </script>
    <script type="module" src="/public/login/login.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:400" />
    <link rel="stylesheet" href="/public/login/login.css" />
  </head>
  <body>
    <div id="wrap">
      <br />
      <div class="buttons">
        <span class="link" id="loginMsal">Sign in with MSAL</span>
        <span class="link" id="loginWebn">Sign in with resident passkey</span>
        <span class="link" id="loginWebnUser">Sign in with username and passkey</span>

        <div id="webn-wrapper">
          <form>
            <input type="text" length="20" id="username" placeholder="username" autocomplete="" required />
            <button id="register">Register</button>
          </form>
        </div>
      </div>
      <br /><br />
      <div id="res"></div>
    </div>
  </body>
</html>
