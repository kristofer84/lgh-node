<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <title>Ljusinställningar</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#222" />
    <link rel="shortcut icon" type="image/x-ms-bmp" href="./favicon.ico" />
    <link rel="stylesheet" href="./styles/config.css" />
    <!-- No inline script or style anywhere on this page: the CSP is
         `script-src 'self'` / `style-src 'self'` with no unsafe-inline. -->
    <script type="module" src="./scripts/config.js"></script>
  </head>
  <body>
    <header>
      <a class="back" href="./dashboard.html">&larr; Planritning</a>
      <h1>Ljusinställningar</h1>
      <label class="room">
        Rum
        <select id="zone"></select>
      </label>
    </header>

    <main>
      <p id="loading">Hämtar…</p>
      <table id="grid" hidden>
        <thead>
          <tr>
            <th class="light">Lampa</th>
            <th>Natt</th>
            <th>Dämpat</th>
            <th>På</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="hint">
        En bock tänder lampan i det läget. För dimbara lampor anger procenten hur
        mycket. Omarkerad betyder släckt i det läget — <em>av</em> släcker alltid allt.
      </p>
    </main>

    <footer>
      <button id="save" type="button" disabled>Spara</button>
      <span id="status" role="status"></span>
    </footer>
  </body>
</html>
